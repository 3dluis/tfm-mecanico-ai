# Especificación declarativa de las fuentes del corpus C-A (R3, PI v4).
#
# Regla de diseño ANTI-CIRCULARIDAD: los documentos se organizan por SUBSISTEMA, SENSOR y
# PID observable — nunca por modo de fallo. Ningún documento lleva `failure_mode` en sus
# metadatos. El conjunto de evidencia de referencia por caso vive en el MANIFIESTO, no en
# el corpus: el corpus no contiene la clave de respuestas.
#
# Regla E-RAG: C-A NO describe los mecanismos de las tres clases held-out
# (corr_break_rpm_maf, load_coolant_decouple, joint_slow_drift). Los episodios held-out de
# suite_v2 son, por tanto, Escenario B de origen natural. Lo verifica
# `tools/contamination_audit.py` sin cambios.
#
# Capa externa: extractos de Wikipedia con revisión FIJADA (`revid`) y texto versionado en
# `external/`. Fijar la revisión hace el corpus reproducible aunque el artículo cambie.

version: corpus-v2
chunking:
  # Chunking por párrafos agregados hasta `target_words`, sin partir frases.
  target_words: 110
  min_words: 35
  overlap_sentences: 1

external:
  license: CC BY-SA 4.0
  attribution_required: true
  user_agent: "MecanicoIA-TFM/1.0 (investigacion academica UAX; corpus RAG OBD-II)"
  articles:
    - {key: obd2-pids,        lang: en, title: "OBD-II PIDs",          topic: pid,        component: ecu}
    - {key: obd2-standard,    lang: en, title: "On-board diagnostics", topic: estandar,   component: ecu}
    - {key: maf-sensor-en,    lang: en, title: "Mass flow sensor",     topic: sensor,     component: maf}
    - {key: maf-sensor-es,    lang: es, title: "Caudalímetro",         topic: sensor,     component: maf}
    - {key: o2-sensor-en,     lang: en, title: "Oxygen sensor",        topic: sensor,     component: o2}
    - {key: o2-sensor-es,     lang: es, title: "Sonda lambda",         topic: sensor,     component: o2}
    - {key: afr,              lang: en, title: "Air–fuel ratio",       topic: combustion, component: mezcla}
    - {key: manifold-vacuum,  lang: en, title: "Manifold vacuum",      topic: admision,   component: colector}
    - {key: thermostat-en,    lang: en, title: "Thermostat",           topic: refrigeracion, component: termostato}
    - {key: thermostat-es,    lang: es, title: "Termostato",           topic: refrigeracion, component: termostato}
    - {key: fuel-injection,   lang: en, title: "Fuel injection",       topic: combustible, component: inyeccion}
    - {key: ecu,              lang: en, title: "Engine control unit",  topic: estandar,   component: ecu}
    - {key: misfire,          lang: en, title: "Engine knocking",      topic: combustion, component: encendido}
    - {key: catalytic,        lang: en, title: "Catalytic converter",  topic: escape,     component: catalizador}
    - {key: ignition,         lang: en, title: "Ignition system",      topic: encendido,  component: encendido}
    - {key: cooling,          lang: en, title: "Internal combustion engine cooling", topic: refrigeracion, component: refrigeracion}

# Reserva: documentación de automoción plausible pero AJENA a los mecanismos evaluados.
# Doble función: (a) relleno para igualar el número de chunks entre variantes de corpus, de
# modo que la exclusión no sea detectable por el tamaño (amenaza a la validez nº 5 del
# diseño experimental); (b) distractores documentales del control negativo CN3.
# NO forma parte de C-A: se incorpora sólo al construir las variantes.
reserve:
  articles:
    - {key: rsv-turbo,        lang: en, title: "Turbocharger",              topic: sobrealimentacion, component: turbo}
    - {key: rsv-dpf,          lang: en, title: "Diesel particulate filter", topic: escape,            component: dpf}
    - {key: rsv-transmision,  lang: en, title: "Automatic transmission",    topic: transmision,       component: caja}
    - {key: rsv-frenos,       lang: en, title: "Disc brake",                topic: frenos,            component: freno}
    - {key: rsv-bateria,      lang: en, title: "Automotive battery",        topic: electrico,         component: bateria}
    - {key: rsv-neumatico,    lang: en, title: "Tire",                      topic: neumaticos,        component: neumatico}
