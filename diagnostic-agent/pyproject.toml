[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diagnostic-agent"
version = "0.1.0"
description = "Núcleo inteligente Edge: adquisición OBD-II, detección ML, agente LangGraph con RAG y memoria de casos (diseñado para Raspberry Pi 5)"
requires-python = ">=3.11"
dependencies = [
    "mecanico-contracts",
    "obd>=0.7.3",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "fastapi>=0.111",
    "uvicorn>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
# Detección: solo runtime de inferencia (NUNCA sklearn/torch aquí; ADR-0009)
detection = ["onnxruntime>=1.17", "numpy>=1.26"]
# Razonamiento LLM (pesado; se instala en la imagen edge completa)
reasoning = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "ollama>=0.3",
]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/diagnostic_agent"]
