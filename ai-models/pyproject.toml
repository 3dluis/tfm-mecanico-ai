[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-models"
version = "0.1.0"
description = "Investigación, entrenamiento, evaluación y exportación de modelos ML (nunca se ejecuta en el edge; ADR-0009)"
requires-python = ">=3.11"
dependencies = [
    "mecanico-contracts",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "pydantic>=2.7",
]

[project.optional-dependencies]
deep = ["torch>=2.2", "onnx>=1.16"]
export = ["skl2onnx>=1.16", "onnx>=1.16", "onnxruntime>=1.17"]
research = ["jupyterlab>=4.0", "matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_models"]
