# Config declarativa del experimento E1 (registro POST-HOC del experimento F3).
# Los parámetros críticos NUNCA viven solo en notebooks (regla docs/models/12).
# Fuente de los resultados: experiments/e1_results.csv + docs/fase3/informe_iteracion_f3.md.

experiment:
  id: EXP-ANOM-001
  title: Baselines no supervisados de detección de anomalías
  protocol: ADR-0011   # umbral 1% FPR solo-train · sin point-adjustment · episodios · held-out intocable

dataset:
  id: obd-lab-suite-v1
  version: "1"
  split: suite-v1-split-1   # normal → train/val · known_fault + held_out → solo test

features:
  schema: fs1               # FEATURE_NAMES v1 (42 features)
  preprocessing: embedded-standard-scaler

random_seed: 42
git_commit: 69a1e4d
hardware: sandbox-x86 (4 CPU / 8 GB)

models:
  - type: robust_zscore
    parameters: {method: median/MAD, aggregation: "max|z|"}
  - type: isolation_forest
    parameters: {n_estimators: 200, random_state: 42}
  - type: lof
    parameters: {n_neighbors: 10, novelty: true}
  - type: ocsvm
    parameters: {nu: 0.01, gamma: 0.005}
