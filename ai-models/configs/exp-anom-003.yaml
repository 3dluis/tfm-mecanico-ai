# EXP-ANOM-003 — Refinamiento del FPR de Event Intelligence (F9).
# Objetivo: diagnosticar la causa de las falsas alarmas de EXP-ANOM-002 (¿datos
# insuficientes, baselines poco representativos, contabilidad de eventos largos,
# contextos inadecuados?) — NO "hacer que Event Intelligence gane".

experiment:
  id: EXP-ANOM-003
  title: Reducción del FPR del brazo de eventos conservando la ventaja relacional
  protocol: ADR-0011 por tick + métricas EVENT-LEVEL nuevas (evaluation.anomaly_events)

dataset:
  id: obd-lab-suite-v1
  version: "1.1"        # v1 + 16 sesiones normales SOLO train (suite_v1_train_ext.yaml)
  frozen: validation/test/held-out IDÉNTICOS a v1 (congelados; jamás se ajusta con ellos)
  train_extension_rationale: |
    EXP-ANOM-002 localizó el FPR en autovía con 2 sesiones/perfil. Se amplía a 8
    urbano + 8 autovía + 3 ralentí + 3 frío con diversidad controlada (semillas
    explícitas 111-142, temperatura ambiente 4-33°C, duraciones 1200-1800s).

arms:  # atribución limpia: cada paso cambia UNA cosa
  - {id: AM-W-v1,  base: anom-lof, train: v1,   note: referencia EXP-ANOM-002}
  - {id: AM-W-v2,  base: anom-lof, train: v1.1, note: equidad — la ventana también recibe los datos}
  - {id: AM-E-v1,  base: event-baseline-z mean/σ, train: v1,   note: referencia}
  - {id: AM-E-d,   base: event-baseline-z mean/σ, train: v1.1, note: aísla el efecto DATOS}
  - {id: AM-E-v2,  base: event-baseline-z ROBUSTO p50/percentiles, train: v1.1, note: añade SCORING}
  - {id: AM-WE-v1, combo: [AM-W-v1, AM-E-v1]}
  - {id: AM-WE-d,  combo: [AM-W-v1, AM-E-d]}
  - {id: AM-WE-v2, combo: [AM-W-v2, AM-E-d]}
  - {id: AM-WE-rob, combo: [AM-W-v2, AM-E-v2]}

evaluation:
  tick_level: se conserva SIEMPRE (compatibilidad EXP-ANOM-002)
  event_level: [event_precision, event_recall, event_f1, false_events_per_normal_session]
  breakdowns: [split, perfil urbano/autovía/..., escenario, categoría]
  analyses: [descomposición de varianza entre/intra sesión (LTFT/MAF/RPM/throttle/load),
             fragmentación de contextos v1 vs v1.1, cobertura de scoring]
  success_criterion: |
    CONJUNTO: FPR + held-out recall + detection delay + event precision. Si reducir el
    FPR elimina la detección de la anomalía relacional, se documenta el trade-off y se
    conserva la versión anterior.

random_seed: 42
hardware: sandbox-x86 (4 CPU / 8 GB)
