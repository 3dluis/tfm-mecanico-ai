# Config declarativa del experimento E11 (F21) — RÉPLICA de cobertura de normalidad.
# CONGELADA ANTES DE EJECUTAR: este fichero se commitea en su propio commit, previo al
# commit que trae resultados (la marca de tiempo de Git es la prueba de anterioridad).
# Fuente de resultados: experiments/e11_results.json (runner e11_replica.py).

experiment:
  id: EXP-ANOM-010
  title: Réplica del efecto de cobertura — AE denso fs1 con normalidad definida A PRIORI
  protocol: ADR-0011 + Adenda XAI v1 (ADR-0033)
  study_type: exploratory   # NO confirmatorio: el pre-registro sigue sin congelar (regla F10)
  validity: entorno emulado/sintético (obd-lab); SIN validez externa hasta HCRL + ARM64/RPi5

background: >
  El brazo control de EXP-ANOM-009 (F18) bajó el FPR del AE denso fs1 de 0.129 a 0.0216
  y subió F1 a 0.727 añadiendo normalidad de autovía que cruza fronteras de cuantización
  del LTFT. Ese resultado NO es promovible: la normalidad añadida se eligió DESPUÉS de
  diagnosticar los falsos positivos sobre el conjunto de test, de modo que el criterio de
  cobertura estaba informado por test. F20 reconstruyó esa misma cobertura desde el
  MECANISMO del generador (paseo aleatorio σ=0.01 %/tick contra cuanto 0.78125 % ⇒ hacen
  falta sesiones LARGAS), sin mirar test. Esta réplica comprueba si el efecto sobrevive
  cuando la cobertura se define a priori.

hypothesis:
  id: HX-ML-4
  statement: >
    Si el techo de la serie EXP-ANOM-006…009 era COBERTURA DE NORMALIDAD y no la
    representación, entonces el mismo AE denso fs1, sin cambiar arquitectura ni
    hiperparámetros, entrenado con el banco v2 (normalidad ampliada por mecanismo)
    reproduce el comportamiento del brazo control de F18 sobre el test histórico
    INTACTO: FPR ≈ 0.02 y F1 ≈ 0.73.
  falsifiable_by: >
    Si el AE entrenado con el banco v2 no baja el FPR de forma defendible (criterios
    numéricos abajo), HX-ML-4 queda REFUTADA: la cobertura no era la causa suficiente y
    el techo es de representación o de canal. La hipótesis NO se reformula tras ver
    resultados y NO se sustituyen los criterios por otros más laxos.

dataset:
  benchmark: synthetic-benchmark-v2 (CONGELADO)
  freeze_manifest: ai-models/configs/benchmark-v2-freeze.json
  benchmark_sha256: e2cdb79f96239b26f67d39d8d1a4ad2fa3b93ab773474400fac922e75503d275
  train_v2: train_v11 (22 sesiones, 9.75 h) + expansion_v2 (12 sesiones, 12.0 h) = 34 sesiones normales
  test: test_historico (8 sesiones, 4.0 h) — NO se toca, NO se regenera, NO se filtra
  test_shift_note: >
    el distribution shift documentado en AUDIT-DATA-001 se conserva a propósito: corregirlo
    ahora convertiría la réplica en una comparación amañada
  representation: fs1 (42 features) por el camino wide canónico, ventana 60 s / stride 30 s
  anti_leakage: split por sesión; el escalador se ajusta SOLO con train; test jamás interviene

arms:
  - name: lof_frozen
    change: NINGUNO — arms-freeze-v1 (fs1, train v1.0, umbral 0.163197). Control externo.
    role: control de integridad del pipeline y referencia de comparación
  - name: ae_v11
    change: NINGUNO respecto a F17/F18 — AE denso fs1 (AE-S) entrenado con train v1.1
    role: línea base interna; aísla el efecto de la cobertura (único cambio entre este brazo y el siguiente)
  - name: ae_v2
    change: SOLO los datos de entrenamiento (train v1.1 + expansión v2). Arquitectura,
      hiperparámetros, escalador, ventana y protocolo de umbral IDÉNTICOS a ae_v11.
    role: candidato de la réplica
  - name: lof_v2
    change: LOF re-entrenado con el banco v2 (informativo)
    role: comprobar si la cobertura ayuda también al detector clásico; NO candidato a adopción

training:
  data: solo normalidad
  scaler: standard, ajustado solo con el train del brazo
  seeds: {arms: [42, 43, 44], reservadas: intactas (901-925, 11000-20036, 30000-30079, 55000, 111000+)}
  note: las semillas de datos ya están gastadas y congeladas en el freeze del banco

threshold:
  method: cuantil (1-FPR) sobre los scores del train del propio brazo (ADR-0011)
  target_fpr: 0.01
  partition: train
  test_nunca: true

metrics:
  core: [precision, recall, f1, pr_auc, roc_auc, fp_rate_normal, fn_rate]
  breakdowns: [FPR por escenario normal y por perfil, recall por fallo, recall por duración]
  temporal: [detection_delay, score_persistence, false_alarm_duration]
  aggregation: mediana sobre las 3 semillas; se reportan además mínimo y máximo

# ---------------------------------------------------------------- criterios A PRIORI
decision_criteria:                 # fijados antes de ejecutar; no se renegocian después
  D1_ae_v2:
    PROMOTE_CANDIDATE:             # candidato a adopción, NO adopción (falta confirmatorio)
      - mediana(fp_rate_normal) <= 0.03
      - todas las semillas con fp_rate_normal <= 0.05
      - mediana(f1) >= 0.70
      - mediana(f1) > 0.6448       # LOF congelado (F18, mismo test)
    PARTIAL:
      - mediana(fp_rate_normal) <= 0.05 y mediana(f1) >= 0.65, sin cumplir todo lo anterior
    REJECT:
      - mediana(fp_rate_normal) > 0.05 o mediana(f1) < 0.6448
  D2_representacion: embeddings — PROMOTE TO EXP-PAT / REJECT / NEEDS MORE EVIDENCE
  D3_xai: solo si D1 = PROMOTE_CANDIDATE (AR@K vs azar sobre el brazo candidato)

predictions:                       # predicciones falsables declaradas ANTES de ejecutar
  P1: fp_rate_normal(ae_v2) < fp_rate_normal(ae_v11)      # referencia F18: 0.1293
  P2: FPR de perfil highway del brazo ae_v2 <= 0.10       # el brazo control de F18 dio 0.0847
  P3: >
    PREDICCIÓN NEGATIVA — el recall de joint_slow_drift y load_coolant_decouple sigue
    < 0.10 con el banco v2. La cobertura NO arregla las anomalías lentas/relacionales:
    esas son fallo de REPRESENTACIÓN (F19 demostró que son separables sin modelos, AUC
    0.986 y 0.673). Si esta predicción falla, la lectura de la serie cambia y se dice.
  P4: lof_frozen reproduce EXACTAMENTE F18 (f1 0.6448, fp_rate_normal 0.0345, umbral 0.163197)

stop_rule: >
  (a) Si P4 falla, el pipeline ha cambiado: se detiene el experimento y se emite un informe
  de deriva de pipeline; NO se interpretan los brazos. (b) Si D1 = REJECT, NO se añade
  capacidad, ni arquitecturas nuevas, ni más datos dentro de F21: se emite informe de causa
  distinguiendo model failure / dataset coverage failure / anomaly construction failure
  (docs/experiments/tipos_de_fallo_experimental.md).

constraints:
  - no se modifica ninguna inyección de anomalía ni su intensidad
  - no se regeneran datos para mejorar métricas; el banco está congelado por hash
  - LOF congelado no se re-entrena ni se reajusta (arms-freeze-v1)
  - nada de esto es confirmatorio: el pre-registro sigue sin congelar
  - sin seeds reservadas
