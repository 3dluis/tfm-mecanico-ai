# EXP-ANOM-002 — Comparación window vs event vs both (R1+E1 fusionados, F8).
#
# Nomenclatura: el usuario etiquetó los brazos A2/A3/A6, pero A0–A6 YA designan
# arquitecturas de agente (ADR-0018). Se conserva la nomenclatura registrada y los
# brazos de detección se denominan por la dimensión anomaly_mode (event-intelligence/11):
#   A2 (del plan del usuario) ↔ AM-W  (window)
#   A3 (del plan del usuario) ↔ AM-E  (event)
#   A6 (del plan del usuario) ↔ AM-WE (window + event, OR)
#
# Equidad: MISMOS datasets, sesiones, splits, escenarios, held-out, semillas y reglas
# de evaluación para todos los brazos; ningún brazo recibe información que los demás no
# tengan (la diferencia de representación ES el objeto del experimento). El detector de
# eventos jamás ve etiquetas (RI1). Sin razonamiento generativo (sin LLM).

experiment:
  id: EXP-ANOM-002
  title: ¿La segmentación por eventos mejora la detección frente a ventanas arbitrarias?
  protocol: ADR-0011 extendido a marco por tick (docs/models/comparisons/anomaly_window_vs_event_v1.md)

dataset:
  id: obd-lab-suite-v1
  version: "1"
  split: suite-v1-split-1        # idéntico a EXP-ANOM-001; held-out INTOCABLE

arms:
  - {id: AM-W,       detector: anom-lof@0.1.0,        features: fs1 (42, ventana 60/30),
     threshold: cuantil 1% FPR sobre scores de train-normal (E1)}
  - {id: AM-E,       detector: event-baseline-z@0.1.0, features: efv:1 (20, por evento),
     grouping: event_type + context_signature,
     threshold: cuantil 1% FPR sobre scores LOSO de eventos train-normal}
  - {id: AM-E-NOCTX, detector: event-baseline-z@0.1.0, features: efv:1,
     grouping: SOLO event_type (ablación — mide la aportación del context_signature),
     threshold: mismo procedimiento LOSO}
  - {id: AM-WE,      combination: OR por tick de AM-W y AM-E (sin umbral nuevo)}

evaluation:
  frame: por tick (marco común: ventana marca sus ticks; evento marca su rango seq)
  point_metrics: [precision, recall, f1, fpr]
  episode_metrics: [episode_recall, heldout_episode_recall, detection_delay_s]
  event_quality: [event_precision, event_recall, event_f1, onset_error, end_error,
                  duration_error, temporal_iou]   # solo brazos de eventos, vs GT obd-lab
  cost_metrics: [t_preprocessing_s, t_features_s, t_scoring_s, t_end_to_end_s,
                 peak_rss_mb, model_size_bytes, n_features]
  breakdowns: [split, categoria (normal/known_fault/held_out), escenario/sesión,
               tipo de evento, tipo de fallo]

random_seed: 42
hardware: sandbox-x86 (4 CPU / 8 GB)
notes: |
  - Baseline global vs por-vehículo: NO evaluable con la suite v1 (un único vehículo
    simulado); limitación documentada, sin forzar conclusiones.
  - Los umbrales se fijan solo con train (LOF) o train-LOSO (eventos); jamás con held-out.
