# Especificación declarativa de la exclusión triple (E-DET / E-RAG / E-MEM) — B0.5.
# CONGELADA con el pre-registro: cambiar clases, alias o términos tras prereg-v1.0
# exige enmienda fechada. La audita `tools/contamination_audit.py`.
#
# Regla de diseño: los términos de mecanismo describen la FIRMA CAUSAL de cada clase
# held-out en lenguaje natural (lo que un documento tendría que decir para «regalar» la
# hipótesis). Son expresiones regulares insensibles a mayúsculas aplicadas sobre texto
# con espacios normalizados. Un alias detectado es violación directa; un término de
# mecanismo también, porque E-RAG excluye descripciones directamente recuperables del
# fallo, no solo su identificador.

heldout_classes:
  corr_break_rpm_maf:
    aliases: [corr_break_rpm_maf, corrbreak]
    mechanism_terms:
      - '(p[ée]rdida|ruptura|rotura)\s+de\s+(la\s+)?correlaci[óo]n[^.]{0,60}(rpm|maf)'
      - 'correlaci[óo]n\s+entre\s+rpm\s+y\s+maf'
  load_coolant_decouple:
    aliases: [load_coolant_decouple, coolfreeze]
    mechanism_terms:
      - 'temperatura\s+(clavada|congelada)'
      - 'desacopl\w*[^.]{0,50}(carga|refrigerante|coolant)'
      - '(coolant|refrigerante)[^.]{0,50}(clavad|congelad|sin\s+microvariaci)'
  joint_slow_drift:
    aliases: [joint_slow_drift, jointdrift]
    mechanism_terms:
      - 'derivas?\s+conjuntas?\s+lentas?'
      - 'deriva\s+lenta\s+conjunta'

# Dónde NO puede aparecer una clase held-out (lado de entrenamiento/conocimiento).
scan:
  # E-DET (a): suites de escenarios — held-out prohibido en secciones train/validation.
  scenario_suites: 'obd-lab/scenarios/*.yaml'
  train_section_keys: [train, train_extension, coverage_extension, validation]
  # E-DET (b): sesiones materializadas de entrenamiento/validación.
  session_dirs:
    - 'data/sessions/train'
    - 'data/sessions_v11/train'
    - 'data/sessions_v2/train'
    - 'data/sessions_v3/train'
    - 'data/sessions_qcontrol/train'
  # E-DET (c): registro de modelos — ninguna corrida de entrenamiento puede referenciar
  # una clase held-out.
  training_runs: 'ai-models/registry/training-runs/*.json'
  # E-RAG: corpus recuperable completo.
  corpus: 'diagnostic-agent/knowledge/*.yaml'
  # Prompts: plantillas que ve el LLM.
  prompt_sources:
    - 'diagnostic-agent/src/diagnostic_agent/reasoning/llm/generator.py'
  # E-MEM: estados iniciales de memoria versionados (semillas/fixtures). Los estados en
  # base de datos se auditan aparte con --memory-state <export.jsonl> antes de cada run.
  memory_seeds: 'diagnostic-agent/knowledge/memory*'

# Lado de evaluación (whitelist): aquí las clases held-out DEBEN poder aparecer y su
# presencia no es contaminación. Documentado para que el alcance del auditor sea explícito.
evaluation_side:
  - 'obd-lab/scenarios/*.yaml (secciones test/held-out)'
  - 'benchmarks/agent-diagnostics/cases_v1.yaml (caso held-out del benchmark)'
  - 'ai-models/configs/*.yaml (los pre-registros NOMBRAN las clases held-out)'
  - 'docs/** (documentación del protocolo)'
  - 'obd-lab/src/obd_lab/injection/** y tests (la inyección IMPLEMENTA los fallos)'
  - 'ai-models/registry/{evaluations,experiments}/** (resultados de evaluación)'

limits: >
  Este auditor cubre artefactos versionados y directorios de datos declarados. No puede
  ver: estados de memoria vivos en PostgreSQL (exportar y pasar con --memory-state),
  corpus cargados fuera de `diagnostic-agent/knowledge/`, ni conocimiento implícito en
  pesos de modelos preentrenados. Esas fronteras se declaran en el pre-registro.
