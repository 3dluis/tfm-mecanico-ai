    profile: urban
    duration_s: 600.0
  input_context: ventana urbana sin DTC; detector en umbral, sin anomalía persistente
  ground_truth: &id001
    failure_mode: null
    component: null
  expected_evidence:
  - todas las señales dentro de bandas y correlaciones conservadas
  acceptable_hypotheses: []
  forbidden_conclusions:
  - diagnosticar avería alguna
  - recomendar intervención
