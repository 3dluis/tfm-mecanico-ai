# Benchmark agent-diagnostics cases_v2 — 40 casos definidos ANTES de evaluar ningun
# modelo (prereg-v1.0 §6.2). INMUTABLE tras commit: ampliaciones = v3, nunca retroactivas.
version: 2
prereg: prereg-v1.0 §6.2 (congelado antes de materializar; inmutable tras commit)
seed_block:
- 30000
- 30039
anomaly_seed_rule: seed + 10000 (bloque 40000-40039; ADR-0034, sin colisión con bloques reservados)
composition:
  total: 40
  simple: 20
  complex: 20
  no_fault: 8
  insufficient_data: 6
  held_out: 0
  negative_controls: CN1-CN4 y CN7-CN9 instanciados aquí; CN5 en EXP-MEM-001 (§6.3); CN6 en el harness
    del verificador
rules:
- ground truth del catálogo de obd-lab; jamás salidas de un LLM
- la etiqueta simple/complex no se reasigna tras ver resultados (§6.2)
- INCONCLUSIVE/INSUFFICIENT_DATA puntúan como acierto en los casos diseñados para ello (§6.4)
- C2-NF-08 (CN3) requiere el manifiesto de distractores del corpus v2 (R3) para instanciarse
cases:
