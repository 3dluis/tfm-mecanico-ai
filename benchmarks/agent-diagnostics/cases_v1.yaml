# Benchmark agent-diagnostics v1 — casos definidos ANTES de evaluar ningún LLM
# (pre-registro). Ground truth = catálogo de fallos de obd-lab; jamás salidas de un LLM.
version: 1
cases:
  - case_id: BENCH-001
    description: fuga de vacío severa capturada en ralentí (caso claro)
    scenario: {scenario_id: bench-vacuum-idle, seed: 9001, fault: vacuum_leak,
               fault_params: {severity: 0.9}, profile: idle, duration_s: 300}
    input_context: anomalía LOF sobre ventana de ralentí (trims/MAP/RPM involucrados)
    ground_truth: {failure_mode: vacuum_leak, component: colector de admisión}
    expected_evidence:
      - trims de combustible positivos sostenidos (STFT+LTFT > 4%)
      - MAP elevado en ralentí
      - ralentí inestable (desviación de RPM alta)
    acceptable_hypotheses: [vacuum_leak, unmetered_air_leak]
    forbidden_conclusions:
      - afirmar fallo de bomba de combustible (los trims positivos con MAP alto no lo soportan)
      - certeza de avería confirmada sin medición dirigida
    expected_outcome: probable

  - case_id: BENCH-002
    description: fuga de vacío capturada EN MARCHA (firma ambigua; exige pedir ralentí)
    scenario: {scenario_id: bench-vacuum-drive, seed: 4242, fault: vacuum_leak,
               fault_params: {severity: 0.9}, profile: highway, duration_s: 300}
    input_context: anomalía LOF en autovía (trims positivos moderados; MAP normal a carga)
    ground_truth: {failure_mode: vacuum_leak, component: colector de admisión}
    expected_evidence:
      - reconocer que en marcha la firma no discrimina vacuum vs deriva MAF
      - solicitar/usar medición en ralentí (herramienta request_measurement)
    acceptable_hypotheses: [vacuum_leak, maf_drift]
    forbidden_conclusions: [concluir vacuum_leak como probable SIN la medición en ralentí]
    expected_outcome: probable   # tras la medición; inconclusive si no hay provider

  - case_id: BENCH-003
    description: deriva de MAF durante aceleraciones (contexto de eventos F6)
    scenario: {scenario_id: bench-maf, seed: 50, fault: maf_drift,
               fault_params: {drift: 0.25}, profile: urban, duration_s: 600}
    input_context: anomalía contextual EVENT (aceleraciones con maf_mean bajo y trims altos
      frente al baseline del vehículo)
    ground_truth: {failure_mode: maf_drift, component: sensor MAF}
    expected_evidence:
      - MAF medio inferior al baseline de aceleraciones comparables
      - trims positivos crecientes con la carga
    acceptable_hypotheses: [maf_drift, vacuum_leak]
    forbidden_conclusions: [atribuir a inyectores sin evidencia de trims por banco]
    expected_outcome: probable

  - case_id: BENCH-004
    description: anomalía held-out relacional (no documentada; NO debe forzarse diagnóstico)
    scenario: {scenario_id: bench-heldout, seed: 7777, fault: corr_break_rpm_maf,
               profile: urban, duration_s: 600}
    input_context: anomalía LOF con PIDs individualmente en rango; sin DTC; sin match en corpus
    ground_truth: {failure_mode: unknown_relational, component: desconocido}
    expected_evidence:
      - describir la relación anómala observada sin nombrar una causa documentada
      - proponer patrón CANDIDATE en memoria (no VALIDATED)
    acceptable_hypotheses: []   # ninguna hipótesis documentada es correcta
    forbidden_conclusions:
      - mapear a un fallo conocido con confianza alta
      - inventar un componente específico
    expected_outcome: inconclusive

  - case_id: BENCH-005
    description: normal-trampa (transitorio de arranque en frío legítimo)
    scenario: {scenario_id: bench-cold, seed: 1234, fault: null,
               profile: cold_start, duration_s: 420}
    input_context: ventana de warm-up con trims moviéndose y temperatura subiendo (sin anomalía real)
    ground_truth: {failure_mode: none, component: none}
    expected_evidence: [reconocer el calentamiento como comportamiento esperado]
    acceptable_hypotheses: [none]
    forbidden_conclusions: [señalar termostato o sonda O2 como fallo]
    expected_outcome: inconclusive   # o cierre sin caso; nunca 'probable'

  - case_id: BENCH-006
    description: datos insuficientes (una sola ventana, sin provider de mediciones)
    scenario: {scenario_id: bench-thin, seed: 31, fault: o2_lag,
               fault_params: {smoothing: 0.7}, profile: urban, duration_s: 90}
    input_context: anomalía débil con 1 ventana y sin posibilidad de medir más
    ground_truth: {failure_mode: o2_lag, component: sonda O2 precat}
    expected_evidence: [declarar qué medición adicional discriminaría]
    acceptable_hypotheses: [o2_lag, maf_drift]
    forbidden_conclusions: [confianza > 0.6 con una sola ventana débil]
    expected_outcome: insufficient_data
