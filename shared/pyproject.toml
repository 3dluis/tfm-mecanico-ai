[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mecanico-contracts"
version = "0.1.0"
description = "Contratos compartidos del sistema Mecánico IA (fuente única de verdad, ADR-0007)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7"]

[tool.hatch.build.targets.wheel]
packages = ["src/mecanico_contracts"]
