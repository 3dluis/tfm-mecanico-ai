name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
      - name: Instalar monorepo (uv.lock, ADR-0032)
        run: |
          uv sync --all-packages --locked
          # Emulador FUERA del lock (setuptools<81 + no-build-isolation, ADR-0003)
          uv pip install "setuptools<81" wheel
          uv pip install --no-build-isolation "ELM327-emulator>=3.0.5"
      - name: Lint (ruff)
        run: |
          uv run ruff check shared obd-lab ai-models diagnostic-agent cloud-platform tools
          uv run ruff format --check shared obd-lab ai-models diagnostic-agent cloud-platform tools
      - name: Tipos (mypy)
        run: uv run mypy
      - name: Tests
        run: uv run pytest --cov
      - name: Esquemas al día (ADR-0007)
        run: |
          uv run python -m mecanico_contracts.export_schemas shared/schemas
          git diff --exit-code shared/schemas

  compose-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar perfiles de compose
        run: |
          for p in dev research cloud edge full; do
            docker compose --profile "$p" config -q && echo "perfil $p OK"
          done
