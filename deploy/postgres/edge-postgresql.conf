# Perfil CONSERVADOR de PostgreSQL para el edge (Raspberry Pi 5, 8 GB) — ADR-0030 §29.
#
# Punto de PARTIDA razonado, NO una optimización: cada valor debe confirmarse con el
# benchmark (make pg-bench) sobre hardware real antes de darlo por bueno. La regla es
# no competir por RAM con el LLM local (que reserva ~2-4 GB) ni castigar la SD/SSD.

# --- memoria (deliberadamente moderada: el LLM también vive en esta máquina)
shared_buffers = 512MB              # ~6% de 8 GB (por defecto 128MB; los grandes usan 25%)
effective_cache_size = 2GB          # pista al planificador, no reserva
work_mem = 8MB                      # por operación de orden/hash; con pocas conexiones basta
maintenance_work_mem = 128MB        # VACUUM/CREATE INDEX sin dispararse

# --- conexiones (el edge es mono-proceso; el pool de la app es de 5+2)
max_connections = 20

# --- WAL y durabilidad (F12 §30)
wal_compression = zstd              # menos bytes escritos en SD/SSD
min_wal_size = 128MB
max_wal_size = 1GB                  # checkpoints menos frecuentes = menos escritura repetida
checkpoint_completion_target = 0.9  # reparte la escritura del checkpoint en el tiempo
# synchronous_commit se mantiene ON: NO se sacrifica durabilidad sin decisión explícita.
# Si algún día se desactiva, debe documentarse el riesgo (perder ~el último medio segundo
# de telemetría ante corte de corriente) y quedar registrado en un ADR.

# --- autovacuum algo más agresivo: la tabla de snapshots crece rápido
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02

# --- planificador para almacenamiento sin cabezales (SSD/NVMe recomendados, F12 §30)
random_page_cost = 1.1
effective_io_concurrency = 200
