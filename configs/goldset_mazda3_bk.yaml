# Conjunto anotado para evaluar la recuperación.
#
# El anclaje NO es mi criterio: es el propio manual. Para cada condición del
# experimento, el documento relevante es el procedimiento diagnóstico que Mazda
# publica para el DTC correspondiente, en la variante del motor del vehículo.
#
# Las consultas describen lo OBSERVADO --lo que E4 y E5 midieron sobre las
# señales-- y NUNCA nombran el DTC ni la causa. Si la consulta contuviera la
# respuesta, la evaluación mediría la consulta y no la recuperación.
#
# DISTRACTOR: cada DTC tiene además su procedimiento para el motor LF. Mismo
# código, contenido casi idéntico, motor inaplicable a este vehículo. No hubo que
# fabricarlo: estaba en el corpus. Es la prueba más dura del filtro de
# aplicabilidad, porque un sistema guiado por similitud lo aceptará.

vehicle_id: mazda-3-bk-2007
engine_code: Z6
corpus_version: "0.1.0"

# Cada caso lleva su consulta en los dos idiomas. La española es traducción
# directa de la inglesa, con el mismo nivel de detalle: si fuera más explícita,
# la comparación mediría la calidad de la traducción y no la recuperación
# translingüe, que es lo que interesa.
#
# El corpus es SOLO inglés. Una consulta en español contra él es recuperación
# translingüe, y es el caso realista: el TFM se escribe en español y el manual
# del fabricante está en inglés.
query_languages: [en, es]

cases:

  - case_id: C01_maf_drift
    fault_id: F02_maf_drift
    dtc: P0102
    query: >-
      Mass airflow sensor reading lower than expected for the current engine
      speed and load. Short term and long term fuel trims elevated and rising
      over several minutes.
    query_es: >-
      Lectura del caudalímetro de aire por debajo de lo esperable para el
      régimen y la carga del motor. Ajustes de combustible a corto y largo
      plazo elevados y creciendo a lo largo de varios minutos.
    relevant_files: [srvc/B3E010200100W01.pdf]
    supporting_files: [srvc/B3E010200102T09.pdf, srvc/B3E010200102W22.pdf]
    distractor_files: [srvc/B3E010201084W06.pdf]
    distractor_reason: "mismo DTC P0102, procedimiento del motor LF, no aplicable al Z6"
    expected_action: EXPLAIN

  - case_id: C02_thermostat_stuck
    fault_id: F03_thermostat_stuck
    dtc: P0125
    query: >-
      Engine coolant temperature stops rising and stabilises well below the
      normal operating range after a cold start, despite sustained load and
      sufficient running time.
    query_es: >-
      La temperatura del refrigerante deja de subir y se estabiliza muy por
      debajo del rango normal de funcionamiento tras un arranque en frío,
      pese a carga sostenida y tiempo de marcha suficiente.
    relevant_files: [srvc/B3E010200100W11.pdf]
    supporting_files: [srvc/B3E010200102T09.pdf, srvc/B3E010200102W22.pdf]
    distractor_files: [srvc/B3E010201084W18.pdf]
    distractor_reason: "mismo DTC P0125, procedimiento del motor LF, no aplicable al Z6"
    expected_action: EXPLAIN

  - case_id: C03_o2_slow_response
    fault_id: F04_o2_lag
    dtc: P0133
    query: >-
      Oxygen sensor voltage oscillation amplitude collapsed and switching
      frequency across the stoichiometric point reduced. Short term fuel trim
      noisier than usual.
    query_es: >-
      Amplitud de oscilación de la tensión de la sonda de oxígeno colapsada
      y frecuencia de conmutación en torno al punto estequiométrico
      reducida. Ajuste de combustible a corto plazo más ruidoso de lo
      habitual.
    relevant_files: [srvc/B3E010200100W13.pdf]
    supporting_files: [srvc/B3E010200102T09.pdf, srvc/B3E010200102W22.pdf]
    distractor_files: [srvc/B3E010201084W20.pdf]
    distractor_reason: "mismo DTC P0133, procedimiento del motor LF, no aplicable al Z6"
    expected_action: EXPLAIN

  - case_id: C04_misfire
    fault_id: F05_misfire
    dtc: P0300
    query: >-
      Brief engine speed drops of around two hundred rpm occurring in short
      episodes, with a simultaneous jump in calculated load and the oxygen
      sensor shifting towards rich.
    query_es: >-
      Caídas breves del régimen de motor de unas doscientas revoluciones en
      episodios cortos, con salto simultáneo de la carga calculada y
      desplazamiento de la sonda de oxígeno hacia mezcla rica.
    relevant_files: [srvc/B3E010200300W01.pdf]
    supporting_files: [srvc/B3E010200102T09.pdf, srvc/B3E010200102W22.pdf]
    distractor_files: [srvc/B3E010201085W01.pdf]
    distractor_reason: "mismo DTC P0300, procedimiento del motor LF, no aplicable al Z6"
    expected_action: EXPLAIN

  - case_id: C05_vacuum_leak
    fault_id: F01_vacuum_leak
    dtc: P2187
    query: >-
      Fuel trims persistently positive and markedly larger at idle than at road
      speed, with elevated intake manifold pressure at idle and unstable idle
      speed.
    query_es: >-
      Ajustes de combustible persistentemente positivos y marcadamente
      mayores en ralentí que a velocidad de carretera, con presión del
      colector de admisión elevada en ralentí y régimen de ralentí
      inestable.
    relevant_files: [srvc/B3E010202100W09.pdf]
    supporting_files: [srvc/B3E010202100W07.pdf, srvc/B3E010202000W10.pdf]
    distractor_files: [srvc/B3E010202100W03.pdf]
    distractor_reason: "mismo DTC P2187, procedimiento del motor LF, no aplicable al Z6"
    expected_action: EXPLAIN
    nota_correccion: >-
      Este caso estuvo marcado como ABSTAIN por un error mío. Busqué P0171 --el
      código genérico OBD-II de mezcla pobre-- y al no encontrarlo concluí que el
      corpus no documentaba la condición. Mazda no usa los códigos genéricos:
      usa la familia P2177/P2178/P2187/P2188. P2187 es "Fuel system too lean at
      idle" y su condición de detección es literalmente la firma de esta
      condición: la centralita vigila los ajustes de combustible a corto y largo
      plazo en control cerrado, en ralentí. El sistema encontró esa evidencia; mi
      búsqueda manual no. Queda anotado porque la lección importa más que el
      error: no haber encontrado un código no es que no haya evidencia.

  # El caso de abstención, ahora construido y no heredado de un descuido.
  - case_id: C06_vacuum_leak_evidencia_retirada
    fault_id: F01_vacuum_leak
    dtc: P2187
    corpus_variant: ABSENT
    # Se retira TODO fragmento que porte estos códigos, no solo el fichero del
    # procedimiento principal. Excluir por fichero dejaba fuera las tablas de
    # códigos y los procedimientos vecinos que mencionan el mismo código, y la
    # evidencia seguía disponible: la condición no era ABSENT de verdad.
    exclude_dtc: [P2187, P2177, P2178, P2188]
    query: >-
      Fuel trims persistently positive and markedly larger at idle than at road
      speed, with elevated intake manifold pressure at idle and unstable idle
      speed.
    query_es: >-
      Ajustes de combustible persistentemente positivos y marcadamente
      mayores en ralentí que a velocidad de carretera, con presión del
      colector de admisión elevada en ralentí y régimen de ralentí
      inestable.
    relevant_files: []
    supporting_files: []
    distractor_files: []
    expected_action: ABSTAIN
    justificacion: >-
      Mismos datos OBD-II, mismo modelo, misma atribución que C05. Lo único que
      cambia es que se retira del índice la evidencia documental que sostenía la
      explicación. Es el experimento central del TFM en un solo caso: si el
      agente explica aquí igual que en C05, no estaba usando la evidencia.

  # --- Las cuatro condiciones de disponibilidad de evidencia -----------------
  # Mismo caso OBD-II, mismo modelo, misma atribución. Lo único que cambia entre
  # las cuatro es qué hay en el índice. Si la decisión no cambiara, el agente no
  # estaría usando la evidencia.

  - case_id: C07_partial
    fault_id: F01_vacuum_leak
    dtc: P2187
    corpus_variant: PARTIAL
    # Se retiran los PROCEDIMIENTOS diagnósticos y se dejan las tablas de códigos
    # y la lógica de detección. El corpus sigue mencionando la condición: dice
    # que ese código existe y qué lo dispara, pero no cómo se diagnostica.
    # Es evidencia relacionada e insuficiente.
    exclude_files: [srvc/B3E010202100W09.pdf, srvc/B3E010202100W07.pdf,
                    srvc/B3E010202100W08.pdf, srvc/B3E010202100W10.pdf,
                    srvc/B3E010202000W10.pdf, srvc/B3E010202100W11.pdf,
                    srvc/B3E010202100W12.pdf]
    query: >-
      Fuel trims persistently positive and markedly larger at idle than at road
      speed, with elevated intake manifold pressure at idle and unstable idle
      speed.
    query_es: >-
      Ajustes de combustible persistentemente positivos y marcadamente mayores en
      ralentí que a velocidad de carretera, con presión del colector de admisión
      elevada en ralentí y régimen de ralentí inestable.
    relevant_files: []
    supporting_files: [srvc/B3E010200102W22.pdf, srvc/B3E010200102T09.pdf]
    distractor_files: []
    expected_action: ABSTAIN
    justificacion: >-
      Que el corpus mencione el código no basta. Una tabla de DTC dice que ese
      código existe; no dice cómo se comprueba ni qué lo causa. La verificación
      de soporte debería rechazarla por no ser contenido diagnóstico, y el
      agente abstenerse.

  - case_id: C08_distractor
    fault_id: F01_vacuum_leak
    dtc: P2187
    corpus_variant: DISTRACTOR
    # Se retira el procedimiento del motor Z6 y se DEJA el del motor LF. Mismo
    # código, contenido casi idéntico, motor inaplicable a este vehículo.
    # La prueba más dura del filtro de aplicabilidad: un sistema guiado por
    # similitud lo aceptará sin dudar.
    exclude_files: [srvc/B3E010202100W09.pdf, srvc/B3E010202100W07.pdf]
    query: >-
      Fuel trims persistently positive and markedly larger at idle than at road
      speed, with elevated intake manifold pressure at idle and unstable idle
      speed.
    query_es: >-
      Ajustes de combustible persistentemente positivos y marcadamente mayores en
      ralentí que a velocidad de carretera, con presión del colector de admisión
      elevada en ralentí y régimen de ralentí inestable.
    relevant_files: []
    supporting_files: []
    distractor_files: [srvc/B3E010202100W03.pdf, srvc/B3E010202100W01.pdf]
    expected_action: ABSTAIN
    justificacion: >-
      El procedimiento del motor LF describe exactamente la misma condición con
      casi las mismas palabras, y no aplica a un Z6. Si el agente lo acepta como
      evidencia, la trazabilidad es aparente: la cita existiría, resolvería y
      sería del vehículo equivocado.

  - case_id: C09_distractor_sin_filtro
    fault_id: F01_vacuum_leak
    dtc: P2187
    corpus_variant: DISTRACTOR_NO_FILTER
    # C08 no probaba lo que decía probar: el filtro de motor bloquea el
    # procedimiento del LF antes de que llegue a ordenarse, así que el distractor
    # nunca alcanzaba al verificador y C08 acababa siendo idéntico a PARTIAL.
    #
    # Aquí se DESACTIVA el filtro a propósito. Es la única forma de medir la
    # última línea de defensa: si el distractor llega, ¿lo rechaza el verificador
    # por sí solo, o lo acepta porque habla de lo mismo con las mismas palabras?
    apply_engine_filter: false
    exclude_files: [srvc/B3E010202100W09.pdf, srvc/B3E010202100W07.pdf]
    query: >-
      Fuel trims persistently positive and markedly larger at idle than at road
      speed, with elevated intake manifold pressure at idle and unstable idle
      speed.
    query_es: >-
      Ajustes de combustible persistentemente positivos y marcadamente mayores en
      ralentí que a velocidad de carretera, con presión del colector de admisión
      elevada en ralentí y régimen de ralentí inestable.
    relevant_files: []
    supporting_files: []
    distractor_files: [srvc/B3E010202100W03.pdf, srvc/B3E010202100W01.pdf]
    expected_action: ABSTAIN
    justificacion: >-
      El procedimiento del LF describe la misma condición con casi las mismas
      palabras y no aplica a un Z6. Sin el filtro de motor, la aplicabilidad del
      fragmento debería bastar para rechazarlo. Si el agente explica aquí, la
      trazabilidad es aparente: la cita existiría, resolvería, y sería del
      vehículo equivocado.

  # --- Ampliación del 4 de septiembre de 2026 (P-03) -------------------------
  #
  # Hasta aquí, las cuatro condiciones de disponibilidad existían para UN solo
  # fallo, el F01. Sostener sobre un único caso que el agente responde a la
  # evidencia es sostenerlo sobre una anécdota, por muy limpio que sea el
  # contraste.
  #
  # Se extienden a F03 y F04 con los MISMOS ficheros que este conjunto ya tenía
  # anotados: el procedimiento del motor Z6 como evidencia relevante, las tablas
  # de códigos como evidencia de apoyo, y el procedimiento del motor LF del mismo
  # código como distractor. No se inventa ningún caso ni se anota ningún fichero
  # nuevo: se aplica a otros dos fallos la construcción que ya se aplicaba a uno.
  #
  # POR QUÉ NO SE EXTIENDEN F02 NI F05. Sus casos con evidencia completa (C01 y
  # C04) se abstienen por confianza baja del modelo --0,600 y 0,462, ambas por
  # debajo del punto de operación 0,79--, no por falta de evidencia. Retirarles
  # la evidencia produciría abstención igualmente, y la abstención estaría
  # sobredeterminada: el contraste no mediría nada. Se declara en lugar de
  # engordar el recuento con casos que no discriminan.

  - case_id: C10_thermostat_absent
    fault_id: F03_thermostat_stuck
    dtc: P0125
    corpus_variant: ABSENT
    exclude_dtc: [P0125]
    query: >-
      Engine coolant temperature stops rising and stabilises well below the
      normal operating range after a cold start, despite sustained load and
      sufficient running time.
    query_es: >-
      La temperatura del refrigerante deja de subir y se estabiliza muy por
      debajo del rango normal de funcionamiento tras un arranque en frío,
      pese a carga sostenida y tiempo de marcha suficiente.
    relevant_files: []
    supporting_files: []
    distractor_files: []
    expected_action: ABSTAIN
    justificacion: >-
      Mismos datos, mismo modelo, misma atribución que C02, que explica con
      confianza 1,000. Lo único que cambia es que se retira del índice todo
      fragmento que porte P0125.

  - case_id: C11_thermostat_partial
    fault_id: F03_thermostat_stuck
    dtc: P0125
    corpus_variant: PARTIAL
    # Se retira el procedimiento diagnóstico del motor Z6 y se dejan las tablas
    # de códigos: el corpus sigue diciendo que P0125 existe y qué lo dispara,
    # pero no cómo se diagnostica.
    exclude_files: [srvc/B3E010200100W11.pdf]
    query: >-
      Engine coolant temperature stops rising and stabilises well below the
      normal operating range after a cold start, despite sustained load and
      sufficient running time.
    query_es: >-
      La temperatura del refrigerante deja de subir y se estabiliza muy por
      debajo del rango normal de funcionamiento tras un arranque en frío,
      pese a carga sostenida y tiempo de marcha suficiente.
    relevant_files: []
    supporting_files: [srvc/B3E010200102T09.pdf, srvc/B3E010200102W22.pdf]
    distractor_files: []
    expected_action: ABSTAIN

  - case_id: C12_thermostat_distractor
    fault_id: F03_thermostat_stuck
    dtc: P0125
    corpus_variant: DISTRACTOR
    exclude_files: [srvc/B3E010200100W11.pdf]
    query: >-
      Engine coolant temperature stops rising and stabilises well below the
      normal operating range after a cold start, despite sustained load and
      sufficient running time.
    query_es: >-
      La temperatura del refrigerante deja de subir y se estabiliza muy por
      debajo del rango normal de funcionamiento tras un arranque en frío,
      pese a carga sostenida y tiempo de marcha suficiente.
    relevant_files: []
    supporting_files: []
    distractor_files: [srvc/B3E010201084W18.pdf]
    expected_action: ABSTAIN
    justificacion: >-
      El procedimiento de P0125 para el motor LF describe la misma condición y no
      aplica a un Z6. Con el filtro de motor activo no debería llegar siquiera al
      verificador.

  - case_id: C13_thermostat_distractor_sin_filtro
    fault_id: F03_thermostat_stuck
    dtc: P0125
    corpus_variant: DISTRACTOR_NO_FILTER
    apply_engine_filter: false
    exclude_files: [srvc/B3E010200100W11.pdf]
    query: >-
      Engine coolant temperature stops rising and stabilises well below the
      normal operating range after a cold start, despite sustained load and
      sufficient running time.
    query_es: >-
      La temperatura del refrigerante deja de subir y se estabiliza muy por
      debajo del rango normal de funcionamiento tras un arranque en frío,
      pese a carga sostenida y tiempo de marcha suficiente.
    relevant_files: []
    supporting_files: []
    distractor_files: [srvc/B3E010201084W18.pdf]
    expected_action: ABSTAIN
    justificacion: >-
      Sin el filtro de motor, el distractor llega al verificador y la
      aplicabilidad del fragmento debe bastar para rechazarlo. Es la última línea
      de defensa, medida sobre un segundo fallo.

  - case_id: C14_o2_absent
    fault_id: F04_o2_lag
    dtc: P0133
    corpus_variant: ABSENT
    exclude_dtc: [P0133]
    query: >-
      Oxygen sensor voltage oscillation amplitude collapsed and switching
      frequency across the stoichiometric point reduced. Short term fuel trim
      noisier than usual.
    query_es: >-
      Amplitud de oscilación de la tensión de la sonda de oxígeno colapsada
      y frecuencia de conmutación en torno al punto estequiométrico
      reducida. Ajuste de combustible a corto plazo más ruidoso de lo
      habitual.
    relevant_files: []
    supporting_files: []
    distractor_files: []
