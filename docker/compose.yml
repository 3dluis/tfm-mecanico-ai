# Entorno reproducible Mecánico IA.
#
# Perfiles:
#   dev     -> desarrollo en la arquitectura del host con límites de recursos
#              equivalentes a una Raspberry Pi 5 (4 vCPU, 8 GB). Mide rendimiento
#              APROXIMADO (ADR-0002): no reproduce la microarquitectura ARM.
#   arm64   -> misma imagen construida para linux/arm64 vía QEMU/binfmt.
#              Valida COMPATIBILIDAD (ruedas, binarios), no rendimiento.
#
# Uso:
#   docker compose -f docker/compose.yml --profile dev up --build
#   docker compose -f docker/compose.yml --profile arm64 build

name: mecanico-ia

x-edge-common: &edge-common
  build:
    context: ..
    dockerfile: docker/edge.Dockerfile
  environment:
    - MECANICO_TRANSPORT=tcp            # en contenedor: emulador por TCP (sin pty compartido)
    - MECANICO_EMULATOR_HOST=emulator
    - MECANICO_EMULATOR_PORT=35000
    - OLLAMA_HOST=http://ollama:11434
  volumes:
    - edge-data:/app/data
  depends_on:
    - emulator
    - ollama

services:
  # ------------------------------------------------------------------ perfil dev
  edge:
    <<: *edge-common
    profiles: [dev]
    # Perfil de recursos Raspberry Pi 5 (8 GB): cota aproximada, ver ADR-0002 y L2.
    cpus: 4
    mem_limit: 8g

  emulator:
    profiles: [dev]
    build:
      context: ..
      dockerfile: docker/edge.Dockerfile
    command: ["python", "-m", "elm", "-n", "35000", "-s", "car"]
    ports:
      - "35000:35000"

  ollama:
    profiles: [dev]
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    # El LLM comparte el presupuesto de recursos del edge en el dispositivo real;
    # aquí se limita por separado y se documenta en las mediciones (ADR-0002).
    cpus: 4
    mem_limit: 6g

  # ---------------------------------------------------------------- perfil arm64
  edge-arm64:
    <<: *edge-common
    profiles: [arm64]
    platform: linux/arm64
    depends_on: []

volumes:
  edge-data:
  ollama-models:
