[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mecanico-ia-exp"
version = "0.1.0"
description = "Laboratorio experimental reproducible del TFM: diagnóstico OBD-II con evidencia trazable y abstención fundamentada"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Propietario" }
authors = [{ name = "Luis Daniel Díaz" }]

# Núcleo: lo mínimo para configuración, datos tabulares y persistencia vectorial.
# Todo lo pesado (torch, shap, jupyter) vive en extras para que el núcleo sea
# instalable y verificable en segundos.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "alembic>=1.13",
    "httpx>=0.27",
    "pypdf>=5.0",
]

[project.optional-dependencies]
# Modelo especializado + XAI (PyTorch se resuelve a la rueda arm64 con MPS).
ml = [
    "torch>=2.3",
    "scikit-learn>=1.5",
    "shap>=0.45",
]
# Capa de análisis y figuras.
nb = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]
# Proveedores LLM y embeddings. httpx basta para hablar con cualquier endpoint
# HTTP; los SDK concretos se añaden solo si un proveedor lo exige.
llm = [
    "tenacity>=8.3",
]
# Embeddings locales: sin clave de API y sin red tras la primera descarga
# del modelo. La abstracción EmbeddingProvider permite sustituirlo.
embeddings = [
    "sentence-transformers>=3.0",
]
# Ajuste fino del SLM con PyTorch + PEFT. Se descartó MLX, que es más rápido en
# Apple Silicon, porque SOLO funciona en Apple Silicon: un tercero con Linux y
# NVIDIA no podría reproducir el ajuste. PyTorch corre en cualquier sitio y es
# el stack declarado, el mismo con el que se entrenó el modelo temporal.
#
# En MPS no hay cuantización a 4 bits, así que el modelo va en bf16.
finetune = [
    "peft>=0.13",
    "accelerate>=1.0",
    "datasets>=3.0",
    # Se importan directamente en `llm/provider.py`, `llm/finetune.py` y
    # `experiments/congelacion.py`. Hasta el 13-10-2026 llegaban solo como
    # dependencia transitiva de `sentence-transformers`: instalar este extra sin
    # aquel dejaba el ajuste sin transformers, y el gate de calidad fallaba en un
    # clon limpio con seis errores de importación. Se declaran donde se usan.
    "transformers>=4.44",
    "huggingface-hub>=0.25",
]
# Montaje del documento entregable. Pandoc convierte el Markdown y `python-docx`
# ensambla el resultado sobre una COPIA de la plantilla oficial: los estilos, la
# portada, los encabezados y los campos de índice no los produce la conversión y
# hay que ponerlos a propósito. Pandoc es una herramienta del sistema y no una
# dependencia de Python; su versión se fija en `docs/entrega-docx.md`.
docx = [
    "python-docx>=1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
]

[project.scripts]
mecanico-exp = "mecanico_ia_exp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mecanico_ia_exp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# En un notebook, importar junto al uso ayuda a leer la celda de forma aislada, y
# el preámbulo carga cosas que no toda celda usa. Ninguna de las dos cosas es un
# defecto aquí: los notebooks son capa de presentación, no código de librería.
"notebooks/*" = ["E402", "I001", "F401", "E501", "RUF001", "RUF002", "RUF003"]
# Los constructores de notebooks son prosa académica en español dentro de
# cadenas: el guion largo, el signo menos y el de multiplicación son la
# tipografía correcta, no caracteres confundibles colados por descuido, y las
# líneas largas son párrafos. Lo que sí se exige aquí es todo lo demás.
"scripts/notebooks/n*.py" = ["E501", "RUF001", "RUF002", "RUF003"]
# El generador de las figuras de la memoria está en el mismo caso: sus cadenas
# son títulos y pies que se imprimen, donde «0–1» con guion largo y el signo
# menos son la tipografía correcta, y los pies de procedencia son párrafos.
"scripts/figuras_memoria.py" = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["shap.*", "pgvector.*", "seaborn.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "db: requiere PostgreSQL local con pgvector",
    "llm: requiere un proveedor LLM configurado",
    "slow: ejecución larga (entrenamiento, corpus completo)",
    "notebook: ejecuta un notebook entero desde un kernel limpio (minutos)",
    "conjunto: necesita synthetic_v2 preprocesado; se reconstruye con scripts/reconstruir_datos.sh",
    "artefactos: necesita artefactos intermedios que NO se distribuyen y NO son reconstruibles (synthetic_v3, que es pre-calibracion, o los ejemplos de ajuste del redactor, que exigen el indice documental)",
]
