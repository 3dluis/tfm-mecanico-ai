# pyproject RAÍZ del monorepo: tooling compartido (ADR-0006) + workspace uv (ADR-0032).
# No define paquete; el código vive en shared/, obd-lab/, ai-models/,
# diagnostic-agent/ y cloud-platform/, cada uno con su propio pyproject.toml.
# Entorno: `uv sync --all-packages` crea .venv con los 5 miembros en editable + grupo dev,
# reproducible por uv.lock (committeado). Ver docs/adr/0032-uv-gestion-entorno.md.

[tool.uv.workspace]
members = ["shared", "obd-lab", "ai-models", "diagnostic-agent", "cloud-platform"]

[tool.uv.sources]
ai-models = { workspace = true }
diagnostic-agent = { workspace = true }
obd-lab = { workspace = true }
cloud-platform = { workspace = true }

[dependency-groups]
# Todo lo que exige `make check` (lint + tipos + tests + regeneración de docs de datos).
# El emulador ELM327 queda FUERA del lock (setuptools<81 + --no-build-isolation, ADR-0003):
# se instala con `make install-emulator`; sus tests se saltan si no está presente.
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "types-PyYAML",
    # extras de miembros necesarios para el gate (export ONNX y runtime de inferencia)
    "ai-models[export]",
    "diagnostic-agent[detection]",
    # tipado del runtime agéntico (subconjunto ligero del extra `reasoning`)
    "langgraph>=0.2",
    "langchain-core>=0.3",
]
# Entrenamiento profundo (torch): SOLO para experimentos de la línea ML (F13+).
# No entra en dev para no arrastrar torch a CI ni a entornos edge:
# `uv sync --all-packages --group train` / `uv run --group train …`.
train = ["ai-models[deep]", "shap>=0.46", "matplotlib>=3.8"]

[tool.ruff]
line-length = 100
src = [
    "shared/src",
    "obd-lab/src",
    "ai-models/src",
    "diagnostic-agent/src",
    "cloud-platform/src",
]
extend-exclude = ["mobile-app", "ai-models/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004", "PLR0917", "PLR0911", "PLC0415", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "shared/src:obd-lab/src:ai-models/src:diagnostic-agent/src:cloud-platform/src"
packages = [
    "mecanico_contracts",
    "obd_lab",
    "ai_models",
    "diagnostic_agent",
    "cloud_platform",
]

[tool.pytest.ini_options]
testpaths = [
    "shared/tests",
    "obd-lab/tests",
    "ai-models/tests",
    "diagnostic-agent/tests",
    "cloud-platform/tests",
    "tests-integration",
]
addopts = "-q --strict-markers"
filterwarnings = [
    # Deprecación UPSTREAM (import interno de fastapi/testclient sobre starlette moderna);
    # no es silenciable desde nuestro código. Se retirará al migrar el TestClient.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
markers = [
    "emulator: pruebas que requieren ELM327-emulator (lentas, solo POSIX)",
    "docker: pruebas que requieren daemon Docker",
]

[[tool.mypy.overrides]]
module = ["obd", "obd.*", "elm", "elm.*", "sklearn.*", "skl2onnx", "skl2onnx.*", "onnxruntime", "yaml", "torch", "torch.*", "shap", "shap.*", "matplotlib", "matplotlib.*", "scipy.*", "joblib"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Los experimentos y scripts de herramienta no exigen strict (los paquetes sí).
module = ["ai_models.experiments.*"]
ignore_errors = true
