[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mecanico-ai-exp"
version = "0.1.0"
description = "Laboratorio experimental reproducible del TFM: diagnóstico OBD-II con evidencia trazable y abstención fundamentada"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "Propietario" }
authors = [{ name = "Luis Daniel Díaz" }]

# Núcleo: lo mínimo para configuración, datos tabulares y persistencia vectorial.
# Todo lo pesado (torch, shap, jupyter) vive en extras para que el núcleo sea
# instalable y verificable en segundos.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
    "alembic>=1.13",
]

[project.optional-dependencies]
# Modelo especializado + XAI (PyTorch se resuelve a la rueda arm64 con MPS).
ml = [
    "torch>=2.3",
    "scikit-learn>=1.5",
    "shap>=0.45",
]
# Capa de análisis y figuras.
nb = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "seaborn>=0.13",
]
# Proveedores LLM y embeddings. httpx basta para hablar con cualquier endpoint
# HTTP; los SDK concretos se añaden solo si un proveedor lo exige.
llm = [
    "httpx>=0.27",
    "tenacity>=8.3",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-pyyaml>=6.0",
]

[project.scripts]
mecanico-exp = "mecanico_ai_exp.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mecanico_ai_exp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["shap.*", "pgvector.*", "seaborn.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "db: requiere PostgreSQL local con pgvector",
    "llm: requiere un proveedor LLM configurado",
    "slow: ejecución larga (entrenamiento, corpus completo)",
]
