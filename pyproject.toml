# pyproject RAÍZ del monorepo: SOLO tooling compartido (ADR-0006).
# No define paquete; el código vive en shared/, obd-lab/, ai-models/,
# diagnostic-agent/ y cloud-platform/, cada uno con su propio pyproject.toml.

[tool.ruff]
line-length = 100
src = [
    "shared/src",
    "obd-lab/src",
    "ai-models/src",
    "diagnostic-agent/src",
    "cloud-platform/src",
]
extend-exclude = ["mobile-app", "ai-models/notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PL", "RUF"]
ignore = ["PLR0913", "PLR2004", "PLR0917", "PLR0911", "PLC0415", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "shared/src:obd-lab/src:ai-models/src:diagnostic-agent/src:cloud-platform/src"
packages = [
    "mecanico_contracts",
    "obd_lab",
    "ai_models",
    "diagnostic_agent",
    "cloud_platform",
]

[tool.pytest.ini_options]
testpaths = [
    "shared/tests",
    "obd-lab/tests",
    "ai-models/tests",
    "diagnostic-agent/tests",
    "cloud-platform/tests",
    "tests-integration",
]
addopts = "-q --strict-markers"
markers = [
    "emulator: pruebas que requieren ELM327-emulator (lentas, solo POSIX)",
    "docker: pruebas que requieren daemon Docker",
]

[[tool.mypy.overrides]]
module = ["obd", "obd.*", "elm", "elm.*", "sklearn.*", "skl2onnx", "skl2onnx.*", "onnxruntime", "yaml"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Los experimentos y scripts de herramienta no exigen strict (los paquetes sí).
module = ["ai_models.experiments.*"]
ignore_errors = true
