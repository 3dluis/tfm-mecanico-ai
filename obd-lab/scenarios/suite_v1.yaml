# Suite v1 de escenarios del TFM (ADR-0011).
#
# Estructura de splits (protocolo anti-circularidad):
#   train      -> SOLO conducción normal (los detectores se ajustan únicamente aquí)
#   validation -> normales + fallos CONOCIDOS (selección de modelo/umbral)
#   test       -> normales + anomalías HELD-OUT (evaluación final; jamás para ajustar)
#
# Toda sesión es reproducible: mismo YAML + misma semilla => mismos bytes.

splits:
  train:
    - {scenario_id: n-urban-a,   description: "Normal urbano A",        category: normal, driving_profile: urban,      duration_s: 1800, seed: 101}
    - {scenario_id: n-urban-b,   description: "Normal urbano B",        category: normal, driving_profile: urban,      duration_s: 1800, seed: 102}
    - {scenario_id: n-highway-a, description: "Normal autovía A",       category: normal, driving_profile: highway,    duration_s: 1800, seed: 103}
    - {scenario_id: n-highway-b, description: "Normal autovía B",       category: normal, driving_profile: highway,    duration_s: 1800, seed: 104}
    - {scenario_id: n-idle-a,    description: "Normal ralentí",         category: normal, driving_profile: idle,       duration_s: 1200, seed: 105}
    - {scenario_id: n-cold-a,    description: "Normal arranque frío",   category: normal, driving_profile: cold_start, duration_s: 1500, seed: 106, ambient_temp_c: 8.0}

  validation:
    - {scenario_id: v-normal-a,  description: "Normal urbano (control FP)",  category: normal, driving_profile: urban,   duration_s: 1800, seed: 201}
    - {scenario_id: v-normal-b,  description: "Normal autovía (control FP)", category: normal, driving_profile: highway, duration_s: 1800, seed: 202}
    - {scenario_id: v-vacuum,    description: "Fuga de vacío",           category: known_fault, driving_profile: urban,   duration_s: 1800, seed: 211, fault: vacuum_leak,      fault_start_s: 600, fault_end_s: 1800}
    - {scenario_id: v-maf,       description: "Deriva de MAF",           category: known_fault, driving_profile: highway, duration_s: 1800, seed: 212, fault: maf_drift,        fault_start_s: 600, fault_end_s: 1800}
    - {scenario_id: v-thermo,    description: "Termostato abierto",      category: known_fault, driving_profile: cold_start, duration_s: 1500, seed: 213, fault: thermostat_stuck, fault_start_s: 0, fault_end_s: 1500, ambient_temp_c: 8.0}
    - {scenario_id: v-o2lag,     description: "Sonda O2 lenta",          category: known_fault, driving_profile: urban,   duration_s: 1800, seed: 214, fault: o2_lag,           fault_start_s: 600, fault_end_s: 1800}
    - {scenario_id: v-misfire,   description: "Fallo de encendido",      category: known_fault, driving_profile: urban,   duration_s: 1800, seed: 215, fault: misfire,          fault_start_s: 600, fault_end_s: 1800}

  test:
    - {scenario_id: t-normal-a,  description: "Normal urbano (control FP)",  category: normal, driving_profile: urban,   duration_s: 1800, seed: 301}
    - {scenario_id: t-normal-b,  description: "Normal autovía (control FP)", category: normal, driving_profile: highway, duration_s: 1800, seed: 302}
    - {scenario_id: t-corrbreak-u, description: "Held-out desacoplo MAF (urbano)",   category: held_out, driving_profile: urban,   duration_s: 1800, seed: 311, fault: corr_break_rpm_maf,   fault_start_s: 600, fault_end_s: 1800}
    - {scenario_id: t-corrbreak-h, description: "Held-out desacoplo MAF (autovía)",  category: held_out, driving_profile: highway, duration_s: 1800, seed: 312, fault: corr_break_rpm_maf,   fault_start_s: 600, fault_end_s: 1800}
    - {scenario_id: t-coolfreeze,  description: "Held-out dinámica térmica muerta",  category: held_out, driving_profile: urban,   duration_s: 1800, seed: 313, fault: load_coolant_decouple, fault_start_s: 600, fault_end_s: 1800}
    - {scenario_id: t-jointdrift,  description: "Held-out deriva conjunta MAF/avance", category: held_out, driving_profile: highway, duration_s: 1800, seed: 314, fault: joint_slow_drift,     fault_start_s: 600, fault_end_s: 1800}
    # Fallos conocidos con semillas nuevas: comprobación de generalización dentro de lo conocido
    - {scenario_id: t-vacuum,    description: "Fuga de vacío (test)",    category: known_fault, driving_profile: urban,   duration_s: 1800, seed: 321, fault: vacuum_leak, fault_start_s: 600, fault_end_s: 1800}
    - {scenario_id: t-maf,       description: "Deriva de MAF (test)",    category: known_fault, driving_profile: highway, duration_s: 1800, seed: 322, fault: maf_drift,   fault_start_s: 600, fault_end_s: 1800}
