# Extensión de NORMALIDAD del train — dataset obd-lab-suite-v1 versión 1.1 (F9, EXP-ANOM-003).
#
# REGLA: esta extensión SOLO añade sesiones normales al split train. Los splits
# validation y test (incluidos los held-out) quedan CONGELADOS e idénticos a la v1 —
# ninguna sesión nueva puede usarse para evaluar, solo para ajustar baselines/umbrales.
#
# Por qué 16 sesiones y estas: EXP-ANOM-002 identificó que el FPR del brazo de eventos
# se concentra en autovía porque solo 2 sesiones/perfil no capturan la variabilidad
# ENTRE sesiones (deriva LTFT, temperatura, dinámica). Se amplía a ≥8 sesiones de los
# perfiles problemáticos (urbano/autovía) y ≥3 del resto, con DIVERSIDAD CONTROLADA:
# semillas explícitas distintas (dinámica de conducción y deriva LTFT independientes),
# temperatura ambiente 6–33 °C (estado térmico), duraciones 1200–1800 s. No son copias:
# cada semilla produce fases de conducción, velocidades objetivo, ruido y deriva LTFT
# distintos por construcción del SignalEngine.

train_extension:
  # --- urbano (+6 → 8 en total)
  - {scenario_id: nx-urban-c, description: "Normal urbano C",  category: normal, driving_profile: urban, duration_s: 1800, seed: 111, ambient_temp_c: 14.0}
  - {scenario_id: nx-urban-d, description: "Normal urbano D",  category: normal, driving_profile: urban, duration_s: 1500, seed: 112, ambient_temp_c: 27.0}
  - {scenario_id: nx-urban-e, description: "Normal urbano E",  category: normal, driving_profile: urban, duration_s: 1800, seed: 113, ambient_temp_c: 21.0}
  - {scenario_id: nx-urban-f, description: "Normal urbano F",  category: normal, driving_profile: urban, duration_s: 1200, seed: 114, ambient_temp_c: 9.0}
  - {scenario_id: nx-urban-g, description: "Normal urbano G",  category: normal, driving_profile: urban, duration_s: 1800, seed: 115, ambient_temp_c: 31.0}
  - {scenario_id: nx-urban-h, description: "Normal urbano H",  category: normal, driving_profile: urban, duration_s: 1500, seed: 116, ambient_temp_c: 18.0}
  # --- autovía (+6 → 8 en total; foco del FPR observado)
  - {scenario_id: nx-highway-c, description: "Normal autovía C", category: normal, driving_profile: highway, duration_s: 1800, seed: 121, ambient_temp_c: 12.0}
  - {scenario_id: nx-highway-d, description: "Normal autovía D", category: normal, driving_profile: highway, duration_s: 1500, seed: 122, ambient_temp_c: 25.0}
  - {scenario_id: nx-highway-e, description: "Normal autovía E", category: normal, driving_profile: highway, duration_s: 1800, seed: 123, ambient_temp_c: 33.0}
  - {scenario_id: nx-highway-f, description: "Normal autovía F", category: normal, driving_profile: highway, duration_s: 1800, seed: 124, ambient_temp_c: 6.0}
  - {scenario_id: nx-highway-g, description: "Normal autovía G", category: normal, driving_profile: highway, duration_s: 1200, seed: 125, ambient_temp_c: 20.0}
  - {scenario_id: nx-highway-h, description: "Normal autovía H", category: normal, driving_profile: highway, duration_s: 1800, seed: 126, ambient_temp_c: 16.0}
  # --- ralentí (+2 → 3)
  - {scenario_id: nx-idle-b, description: "Normal ralentí B", category: normal, driving_profile: idle, duration_s: 1200, seed: 131, ambient_temp_c: 24.0}
  - {scenario_id: nx-idle-c, description: "Normal ralentí C", category: normal, driving_profile: idle, duration_s: 1500, seed: 132, ambient_temp_c: 11.0}
  # --- arranque en frío (+2 → 3)
  - {scenario_id: nx-cold-b, description: "Normal arranque frío B", category: normal, driving_profile: cold_start, duration_s: 1500, seed: 141, ambient_temp_c: 4.0}
  - {scenario_id: nx-cold-c, description: "Normal arranque frío C", category: normal, driving_profile: cold_start, duration_s: 1500, seed: 142, ambient_temp_c: 12.0}
