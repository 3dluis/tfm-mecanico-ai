[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "obd-lab"
version = "0.1.0"
description = "Laboratorio de simulación OBD-II: emulación ELM327, escenarios, inyección de fallos, replay de datasets (contribución C4 del TFM)"
requires-python = ">=3.11"
dependencies = [
    "mecanico-contracts",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# El emulador exige setuptools<81 + --no-build-isolation (ADR-0003)
emulator = ["ELM327-emulator>=3.0.5"]
dev = ["pytest>=8.0", "types-PyYAML"]

[project.scripts]
obd-lab = "obd_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/obd_lab"]

[tool.hatch.metadata]
allow-direct-references = true
